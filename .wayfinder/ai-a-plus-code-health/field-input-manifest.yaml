head_to_head_contract:
  baseline: S_strong_single_one_review_of_full_scoped_source
  proposed: F_runtime_feedback_using_smaller_model_for_every_operational_llm_call
  model_strength: declare_selected_model_versions_and_reason_for_strong_vs_small_before_final
  controls:
    - same_case_task_source_snapshot_scope_and_gold_secrecy
    - same_risk_taxonomy_output_schema_and_20_minute_ceiling
    - same_total_token_ceiling_across_all_operational_calls
    - single_strong_call_vs_all_small_system_calls_and_tools_reported
    - tool_and_context_advantage_is_system_effect_not_model_only_effect
  gold: independent_multi_finding_labels_with_negative_cases_and_finding_type
  missing_output: all_unreported_gold_findings_count_as_false_negatives
  cost: provider_billed_input_output_and_cache_tokens_all_calls_including_failures_plus_operational_tools_reported_separately
  preregistration: freeze_both_models_prices_prompts_case_set_and_judge_before_final_outputs
  existing_six_arm_ablation: same_smaller_model_version_and_budget_within_A_to_F_only

core_ablation_contract:
  design: six_cumulative_arms_with_adjacent_pair_comparison
  model_scope: A_to_F_use_one_smaller_model_version_not_the_strong_single_comparator
  arms:
    A_plain_llm: raw_diff_or_user_seeded_source_plus_one_generic_review
    B_structured_review: A_plus_fixed_five_perspective_schema
    C_static_facts: B_plus_ast_symbol_import_and_lexical
    D_graph_context: C_plus_bounded_two_hop_code_graph
    E_evidence_contract: D_plus_HypothesisContract_and_evidence_status
    F_runtime_feedback: E_plus_approved_dynamic_validation_DAG
  adjacent_contribution:
    structured_review: B_minus_A
    static_facts: C_minus_B
    code_graph: D_minus_C
    evidence_contract: E_minus_D
    runtime_feedback: F_minus_E
  same_budget_controls:
    - same_case_split_and_input_snapshot
    - same_model_version_and_sampling_settings
    - same_total_token_tool_second_and_wall_time_ceiling
    - same_retry_limit_and_output_schema
    - unused_budget_is_not_reallocated
    - arm_definitions_freeze_after_pilot_before_final_holdout
  keep_predicate:
    pass_when:
      - preregistered_target_quality_metric_gain_at_least_5_percentage_points
      - or_cost_reduction_at_least_10_percent_without_quality_guardrail_failure
    required_for_both:
      - no_critical_high_recall_guardrail_failure
      - no_additional_unsafe_or_unsupported_claim
  fail_action: remove_from_core_and_move_to_experimental_or_excluded
  project_claim_source: frozen_final_holdout_only
  experimental_pair:
    function_local_cfg_def_use: F_vs_F_plus_CFG_on_eligible_functions_under_same_budget

experiment_isolation_contract:
  execution: shadow_subprocess_reading_same_immutable_input
  budget: separate_from_core_and_paired_with_its_control
  writable_state: experiment_specific_output_directory_only
  core_cache_mutation: prohibited
  output:
    format: same_finding_schema_with_EXPERIMENTAL_label
    location: separate_experiment_result
    finding_id_prefix: X
    merge_into_core_risk_table: prohibited
    count_in_core_kpi_or_a_plus_claim: prohibited
  lineage_required:
    - experiment_id_and_feature_version
    - base_run_id_and_source_sha
    - config_model_prompt_and_budget_hash
  failure_isolation:
    experiment_timeout_error_or_partial_result: record_and_stop_experiment_only
    core_run_status_change: prohibited
  promotion:
    evidence: frozen_same_budget_paired_evaluation_not_used_for_tuning
    pass_when:
      - target_quality_gain_at_least_5_percentage_points
      - or_cost_reduction_at_least_10_percent_without_quality_guardrail_failure
    required:
      - no_critical_high_recall_regression
      - no_unsafe_or_unsupported_claim
      - reproducible_result_and_lineage
    application: move_to_core_only_in_next_manifest_version
    retroactive_change_to_completed_final_result: prohibited
    automatic_promotion: prohibited
  rollback:
    trigger: later_revalidation_breaks_promotion_guardrail_or_reproducibility
    action: move_back_to_experimental_in_new_manifest_version_and_rerun_affected_comparison

experimental_candidate_contract:
